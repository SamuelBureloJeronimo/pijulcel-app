<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      <div class="title-center">
        <ion-icon name="apps"></ion-icon>
        <span>Lista de pedidos</span>
      </div>
    </ion-title>
    <ion-progress-bar *ngIf="this.isLoad" type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
  <!-- 🔎 Barra de búsqueda -->
  <ion-toolbar>
    <ion-searchbar placeholder="Buscar por código, teléfono o cliente..." (ionInput)="filtrarPedidos($event)">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Refresh -->
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="pedidosFiltrados.length > 0; else sinPedidos">
    <ion-item *ngFor="let pedido of pedidosFiltrados">
      <!-- Imagen desde carpeta public -->
      <ion-thumbnail slot="start">
        <img [src]="'assets/images/' + pedido.img_1" alt="Pedido" class="pedido-img" />
      </ion-thumbnail>

      <!-- Datos del pedido -->
      <ion-label>
        <h2>{{ pedido.name_cli }}</h2>
        <p>Código: {{ pedido.bar_code }}</p>
        <p>Tel: {{ pedido.tel_cli }}</p>
        <p>Fecha: {{ pedido.created | date:'short' }}</p>
      </ion-label>

      <!-- Estatus -->
      <ion-badge color="warning" slot="end">
        {{ pedido.estatus }}
      </ion-badge>
    </ion-item>
  </ion-list>

  <!-- Template alternativo cuando no hay datos -->
  <ng-template #sinPedidos>
    <div class="empty-list">
      <ion-icon name="information-circle-outline" size="large"></ion-icon>
      <p>No hay pedidos pendientes</p>
    </div>
  </ng-template>


  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
